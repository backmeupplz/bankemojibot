<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1f8a5b"/>
      <stop offset="1" stop-color="#0b3d2a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset=".45" stop-color="#f4b93a"/>
      <stop offset="1" stop-color="#b9761a"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd45e"/>
      <stop offset="1" stop-color="#e09a22"/>
    </linearGradient>
    <linearGradient id="emb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a8640f"/>
      <stop offset="1" stop-color="#8a4f08"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#021a10" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#fff3c4" opacity=".9">
    <path d="M790 250 l14 38 38 14 -38 14 -14 38 -14 -38 -38 -14 38 -14z"/>
    <path d="M228 700 l9 25 25 9 -25 9 -9 25 -9 -25 -25 -9 25 -9z"/>
    <path d="M262 300 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
  </g>

  <g filter="url(#sh)">
    <circle cx="512" cy="512" r="300" fill="url(#rim)"/>
    <circle cx="512" cy="512" r="300" fill="none" stroke="#9a5e10" stroke-width="6"/>
    <circle cx="512" cy="512" r="248" fill="url(#face)"/>
    <circle cx="512" cy="512" r="248" fill="none" stroke="#c07f1b" stroke-width="10"/>
    <circle cx="512" cy="512" r="226" fill="none" stroke="#fff0b8" stroke-opacity=".5" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>
  </g>

  <!-- embossed bank: pediment, columns, base -->
  <g fill="url(#emb)">
    <path d="M512 352 L672 432 L352 432 Z"/>
    <rect x="356" y="444" width="312" height="22" rx="6"/>
    <rect x="378" y="478" width="34" height="134" rx="8"/>
    <rect x="452" y="478" width="34" height="134" rx="8"/>
    <rect x="538" y="478" width="34" height="134" rx="8"/>
    <rect x="612" y="478" width="34" height="134" rx="8"/>
    <rect x="356" y="624" width="312" height="22" rx="6"/>
    <rect x="336" y="656" width="352" height="24" rx="8"/>
  </g>
  <!-- highlight on emboss -->
  <path d="M512 368 L636 430 L388 430 Z" fill="#ffe08a" opacity=".22"/>
  <!-- coin shine -->
  <path d="M330 360 A260 260 0 0 1 560 268" fill="none" stroke="#fffbe6" stroke-opacity=".55" stroke-width="18" stroke-linecap="round"/>
</svg>
